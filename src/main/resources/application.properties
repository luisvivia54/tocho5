spring.application.name=tocho5

# =================================================================
# VERSION
# =================================================================
API_KS-version=KS-Version 1.0.0

# =================================================================
# R2 (Cloudflare) - TODO desde ENV, NADA hardcodeado
# =================================================================
r2.endpoint=${R2_ENDPOINT:https://7187a6b46cc1b545de37d29582df1592.r2.cloudflarestorage.com}
r2.bucketName=${R2_BUCKET_NAME:tocho5-dev}
r2.accessKeyId=${R2_ACCESS_KEY_ID}
r2.secretAccessKey=${R2_SECRET_ACCESS_KEY}
r2.publicBaseUrl=${R2_PUBLIC_BASE_URL:https://media.tochero5.mx}

# =================================================================
# DATASOURCE (todo desde ENV)
# =================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# No exponer SQL en logs de prod
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=60000

# =================================================================
# UPLOADS (limitar tamaño para prevenir DoS por archivos grandes)
# =================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# =================================================================
# KEYCLOAK / JWT (RESOURCE SERVER)
# =================================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:https://auth.tochero5.mx/realms/tochero5}

# Keycloak Admin Client (para gestionar usuarios/roles)
keycloak.admin.server-url=${KEYCLOAK_ADMIN_SERVER_URL:https://auth.tochero5.mx}
keycloak.admin.realm=${KEYCLOAK_ADMIN_REALM:tochero5}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:tocho5-admin-service}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}
keycloak.admin.connect-timeout-millis=${KEYCLOAK_ADMIN_CONNECT_TIMEOUT:5000}
keycloak.admin.read-timeout-millis=${KEYCLOAK_ADMIN_READ_TIMEOUT:10000}

# =================================================================
# HARDENING GENERAL
# =================================================================
# No mandar stack traces al cliente
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Ocultar versión del servidor en la cabecera
server.server-header=
server.error.whitelabel.enabled=false

# Forzar que el cuerpo del error sea JSON
spring.mvc.problemdetails.enabled=true
