spring.application.name=tocho5


#Version
API_KS-version=KS-Version 1.0.0


#dev_lab
#spring.datasource.url=jdbc:mysql://localhost:3306/tocho5?useSSL=false&serverTimezone=UTC
#spring.datasource.username=root
#spring.datasource.password=aisha200

# --- Datasource: toma todo de ENV ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=60000

# =========================
#   KEYCLOAK / JWT (BACK)
# =========================

# Opción 1: usando issuer-uri (la más simple)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://auth.tochero5.mx/realms/tochero5
